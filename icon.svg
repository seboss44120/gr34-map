<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
  </defs>

  <!-- Fond plein (full-bleed, aucun angle blanc) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Hermines fantômes en filigrane -->
  <g opacity="0.04" fill="white">
    <g transform="translate(72,152)"><path d="M0,-12 C-12,-12 -17,-2 -14,9 C-12,18 -6,23 0,25 C6,23 12,18 14,9 C17,-2 12,-12 0,-12Z"/><circle cx="-13" cy="-20" r="5"/><circle cx="0" cy="-24" r="5"/><circle cx="13" cy="-20" r="5"/></g>
    <g transform="translate(448,128) rotate(-18)"><path d="M0,-12 C-12,-12 -17,-2 -14,9 C-12,18 -6,23 0,25 C6,23 12,18 14,9 C17,-2 12,-12 0,-12Z"/><circle cx="-13" cy="-20" r="5"/><circle cx="0" cy="-24" r="5"/><circle cx="13" cy="-20" r="5"/></g>
    <g transform="translate(60,430) rotate(10)"><path d="M0,-12 C-12,-12 -17,-2 -14,9 C-12,18 -6,23 0,25 C6,23 12,18 14,9 C17,-2 12,-12 0,-12Z"/><circle cx="-13" cy="-20" r="5"/><circle cx="0" cy="-24" r="5"/><circle cx="13" cy="-20" r="5"/></g>
    <g transform="translate(450,415) rotate(-8)"><path d="M0,-12 C-12,-12 -17,-2 -14,9 C-12,18 -6,23 0,25 C6,23 12,18 14,9 C17,-2 12,-12 0,-12Z"/><circle cx="-13" cy="-20" r="5"/><circle cx="0" cy="-24" r="5"/><circle cx="13" cy="-20" r="5"/></g>
    <g transform="translate(256,385)"><path d="M0,-12 C-12,-12 -17,-2 -14,9 C-12,18 -6,23 0,25 C6,23 12,18 14,9 C17,-2 12,-12 0,-12Z"/><circle cx="-13" cy="-20" r="5"/><circle cx="0" cy="-24" r="5"/><circle cx="13" cy="-20" r="5"/></g>
  </g>

  <!-- BZH -->
  <text x="256" y="128" text-anchor="middle"
        font-family="Georgia,serif" font-size="112" font-weight="bold"
        fill="white" letter-spacing="14">BZH</text>

  <!-- Ligne séparatrice -->
  <line x1="64" y1="152" x2="448" y2="152" stroke="white" stroke-width="1.5" opacity="0.18"/>

  <!-- SAC À DOS — randonnée (vert) -->
  <g fill="#22c55e">
    <rect x="100" y="245" width="16" height="90" rx="8"/><!-- sangle gauche -->
    <rect x="195" y="245" width="16" height="90" rx="8"/><!-- sangle droite -->
    <rect x="113" y="210" width="84" height="38" rx="11"/><!-- rabat -->
    <rect x="113" y="242" width="84" height="108" rx="13"/><!-- corps -->
    <rect x="125" y="286" width="60" height="52" rx="9" fill="#16a34a"/><!-- poche avant -->
  </g>

  <!-- ROUE DE VÉLO (violet) -->
  <g stroke="#7c3aed" fill="none">
    <circle cx="362" cy="300" r="93" stroke-width="15"/>
    <circle cx="362" cy="300" r="74" stroke-width="4.5"/>
    <line x1="362" y1="226" x2="362" y2="374" stroke-width="6"/>
    <line x1="298" y1="263" x2="426" y2="337" stroke-width="6"/>
    <line x1="426" y1="263" x2="298" y2="337" stroke-width="6"/>
  </g>
  <circle cx="362" cy="300" r="17" fill="#7c3aed"/>

  <!-- Guidon (violet) -->
  <g stroke="#7c3aed" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="340" y1="207" x2="384" y2="207"/>
    <line x1="362" y1="207" x2="362" y2="226"/>
  </g>

  <!-- GR 34 en bas -->
  <text x="256" y="476" text-anchor="middle"
        font-family="Georgia,serif" font-size="30"
        fill="white" opacity="0.28" letter-spacing="8">GR 34</text>
</svg>
